<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<base target="_top">
<meta name="theme-color" content="#4f46e5">
<title>דרור · שחר · סנכרון יומי</title>
<style>
:root{
  --bg:#f4f5fa;--card:#fff;--text:#1d2033;--muted:#6b7090;--line:#e6e8f0;
  --pri:#4f46e5;--pri-2:#eef0ff;--ok:#16a34a;--ok-2:#e8f7ee;--warn:#c2410c;--warn-2:#fff3e6;
  --bad:#dc2626;--bad-2:#fdecec;--radius:16px;
  --shadow:0 1px 2px rgba(20,20,50,.05),0 6px 18px rgba(20,20,50,.06);
  --nav-h:66px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1117;--card:#181b24;--text:#e8eaf2;--muted:#9aa0b8;--line:#2a2e3c;--pri:#8b93ff;--pri-2:#23264a;
        --ok-2:#12301f;--warn:#fb923c;--warn-2:#38260f;--bad:#f87171;--bad-2:#3a1717;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Hebrew",Rubik,Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
[hidden]{display:none!important}
.muted{color:var(--muted)}.small{font-size:.82rem}.grow{flex:1}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:1.05rem}.brand span{font-size:.78rem;color:var(--muted)}
.sync{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none;transition:background .2s}
.sync.busy{background:var(--pri);animation:pulse 1s infinite}.sync.bad{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--pri);color:#fff}

main{max-width:760px;margin:0 auto;padding:14px 14px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom))}
.tab{display:none}.tab.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);
  padding:14px 16px;margin-bottom:14px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-head h2{font-size:1.02rem;margin:0;flex:1}
h3{margin:0;font-size:1.05rem}
h4{margin:14px 0 6px;font-size:.85rem;color:var(--muted);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:14px 6px;font-size:.92rem}
.page-title{font-size:1.25rem;margin:4px 2px 12px;display:flex;align-items:center;gap:8px;font-weight:800}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:var(--card);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:.92rem;
  text-decoration:none;color:var(--text);min-height:42px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-2);background:var(--bad-2)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.84rem;border-radius:10px}
.btn.big{width:100%;padding:14px;font-size:1rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:6px 8px;border-radius:10px;color:var(--muted);font-size:1rem}
.icon-btn.sm{padding:2px 6px;font-size:.7rem}
.icon-btn:hover{background:var(--pri-2)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;padding:2px 8px;border-radius:999px;
  background:var(--pri-2);color:var(--pri);white-space:nowrap;text-decoration:none;font-weight:600}
.chip.bad{background:var(--bad-2);color:var(--bad)}.chip.warn{background:var(--warn-2);color:var(--warn)}
.chip.ok{background:var(--ok-2);color:var(--ok)}.chip.gray{background:var(--bg);color:var(--muted)}
.chip.own-Dror{background:#e0f2fe;color:#0369a1}.chip.own-Shachar{background:#fce7f3;color:#be185d}
@media (prefers-color-scheme:dark){.chip.own-Dror{background:#0c2f45;color:#7dd3fc}.chip.own-Shachar{background:#43142d;color:#f9a8d4}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.85rem;
  cursor:pointer;white-space:nowrap;color:var(--text)}
.fchip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.fchip .n{opacity:.6;margin-inline-start:4px;font-size:.78rem}

.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.item.pending,.pending{opacity:.55}
.item-body{flex:1;min-width:0;cursor:pointer}
.item-title{font-weight:600;word-break:break-word}
.item.done .item-title,.item.discussed .item-title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:.78rem}
.item-notes{font-size:.85rem;color:var(--muted);margin-top:4px;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item.overdue{background:linear-gradient(270deg,transparent,var(--bad-2));margin:0 -16px;padding:10px 16px;border-inline-start:3px solid var(--bad)}
.meta>*{min-width:0;max-width:100%}.meta .chip{overflow:hidden;text-overflow:ellipsis}.meta>span.muted{overflow-wrap:anywhere}
.src{margin-top:6px;font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 9px;cursor:default}
.src-line{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;line-height:1.35}
.src-k{font-weight:700;color:var(--pri)}
.src-t{font-weight:600;word-break:break-word}
.src-d{color:var(--muted);white-space:nowrap}
.src a.src-l{color:var(--pri);font-weight:700;text-decoration:none;white-space:nowrap;padding:2px 0}
.src details{margin-top:3px}
.src summary{cursor:pointer;color:var(--muted);list-style:none;display:inline-block;padding:3px 0;font-weight:600}
.src summary::-webkit-details-marker{display:none}
.src summary::before{content:'▸ ';display:inline-block}
.src details[open] summary::before{content:'▾ '}
.src-ctx{margin-top:2px;color:var(--text);line-height:1.45;word-break:break-word}
.src-q{margin-top:5px;padding-inline-start:8px;border-inline-start:3px solid var(--pri-2);color:var(--muted);font-style:italic;word-break:break-word}
.src-q .who{font-style:normal;font-size:.75rem}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--card);
  color:transparent;cursor:pointer;font-weight:900;font-size:.85rem;display:grid;place-items:center;margin-top:1px;transition:all .15s;padding:0}
.check:hover{border-color:var(--ok);color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tbox{flex:none;font-size:.78rem;font-weight:700;color:var(--pri);background:var(--pri-2);border-radius:8px;padding:3px 7px;margin-top:2px}
.reorder{display:flex;flex-direction:column}
.group-title{font-size:.82rem;font-weight:700;color:var(--muted);margin:14px 2px 6px}

.meet{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:0}
.meet .muted{color:rgba(255,255,255,.8)}
.meet-when{font-size:1.5rem;font-weight:800;margin:2px 0}
.meet-sub{font-size:.9rem;opacity:.92}
.meet .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff}
.meet .btn.primary{background:#fff;color:#4f46e5;border-color:#fff}
.meet-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.2)}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.slot{border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700;direction:ltr}
.slot.on{background:#fff;color:#4f46e5;border-color:#fff}

.quick{display:flex;gap:8px;margin-top:10px}
.quick input{flex:1;min-width:0}
input[type=text],input[type=url],input[type=date],input[type=time],input[type=number],input:not([type]),select,textarea{
  width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-2)}
textarea{resize:vertical;min-height:80px}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.more>summary{cursor:pointer;color:var(--pri);font-size:.88rem;margin-bottom:10px;list-style:none}

.tm-main{text-align:center;margin:4px 0 8px}
.tm-total{font-size:3.2rem;font-weight:800;letter-spacing:1px;direction:ltr;font-variant-numeric:tabular-nums;line-height:1.1}
.tm-total.warn{color:var(--warn)}.tm-total.over{color:var(--bad)}
.tm-label{font-size:.8rem;color:var(--muted)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--pri);border-radius:99px;transition:width .4s linear}
.bar.sm{height:6px;margin-top:6px}
.bar i.over{background:var(--bad)}.bar i.warn{background:var(--warn)}
.tm-item{margin-top:12px;background:var(--pri-2);border-radius:12px;padding:10px 12px}
.tm-item-row{display:flex;align-items:center;gap:8px}
.tm-item-title{font-weight:700;flex:1}
.tm-item-time{font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.tm-item-time.over{color:var(--bad)}
.tm-steps{list-style:none;margin:10px 0 0;padding:0;font-size:.86rem}
.tm-steps li{display:flex;gap:8px;padding:4px 0;color:var(--muted)}
.tm-steps li span{flex:1}
.tm-steps li.cur{color:var(--text);font-weight:700}
.tm-steps li.done span{text-decoration:line-through}
.tm-ctrl{display:flex;gap:8px;margin-top:12px}
.tm-ctrl .btn{flex:1;padding:9px 6px}

details.sum{padding:0}
details.sum>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px}
details.sum>summary::-webkit-details-marker{display:none}
details.sum>summary>div{flex:1}
.sum-date{font-weight:800}
.chev{transition:transform .2s;color:var(--muted)}
details[open] .chev{transform:rotate(180deg)}
.sum-body{padding:0 16px 14px;border-top:1px solid var(--line)}
.prose{white-space:pre-wrap;font-size:.95rem}
ul.bul{margin:0;padding-inline-start:20px}ul.bul li{margin:3px 0}
.sum-foot{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}

nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav-in button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:.74rem;color:var(--muted);position:relative}
.nav-in button .ic{font-size:1.3rem;line-height:1;filter:grayscale(1);opacity:.7}
.nav-in button.on{color:var(--pri);font-weight:700}
.nav-in button.on .ic{filter:none;opacity:1}
.badge{position:absolute;top:8px;left:calc(50% - 26px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);
  color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;padding:0 5px}
.badge.blue{background:var(--pri)}
.fab{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));left:max(16px,calc(50% - 364px));
  z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:1.8rem;
  box-shadow:0 8px 24px rgba(79,70,229,.4);cursor:pointer;line-height:1}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-head{display:flex;align-items:center;margin-bottom:12px}.sheet-head h3{flex:1}
.sheet-foot{display:flex;gap:8px;align-items:center;margin-top:6px}
.who-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 4px}
.who-btns .btn{padding:22px 10px;font-size:1.1rem;flex-direction:column}

.toast{position:fixed;bottom:calc(var(--nav-h) + 86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:90vw;
  box-shadow:var(--shadow);animation:fade .2s}
.toast.bad{background:var(--bad);color:#fff}
.skel{height:90px;border-radius:var(--radius);margin-bottom:14px;
  background:linear-gradient(90deg,var(--card) 25%,var(--line) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.err{text-align:center;padding:40px 16px}
.sum-tools{display:flex;gap:8px;margin-bottom:10px;position:sticky;top:64px;z-index:5;background:var(--bg);padding:4px 0}
.sum-tools input{flex:1;min-width:0}.sum-tools select{width:auto;max-width:44%}
.sum-title{font-weight:800;word-break:break-word}
.month-title{font-size:.82rem;font-weight:800;color:var(--muted);margin:16px 2px 8px}
.more-btn{width:100%;margin-bottom:14px}

.today-board{border:1.5px solid #e8b84a;background:linear-gradient(180deg,#fff8e6 0%,var(--card) 42px)}
.today-board .card-head h2{color:#9a6700}
.today-board.over{box-shadow:0 0 0 3px rgba(232,184,74,.45)}
.today-empty{border:1.5px dashed var(--line);border-radius:12px;padding:16px 10px;text-align:center;color:var(--muted);font-size:.9rem;margin:4px 0 8px}
.today-add{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:stretch}
.today-add input[name=title]{flex:1 1 150px;min-width:0}
.today-add select{flex:0 1 118px;width:auto;min-width:0;max-width:100%}
.today-add .btn{flex:0 0 auto}
.task-tools{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;margin-top:1px}
.drag-handle{flex:none;cursor:grab;touch-action:none;color:var(--muted);padding:6px 4px;font-size:1.05rem;line-height:1;
  user-select:none;-webkit-user-select:none;border:0;background:transparent}
.drag-handle:active{cursor:grabbing}
.today-pin{border:0;background:var(--pri-2);color:var(--pri);border-radius:999px;padding:2px 8px;font-size:.75rem;font-weight:700;
  cursor:pointer;white-space:nowrap;min-height:28px}
.today-x{color:var(--muted);font-size:1rem;line-height:1;min-width:28px;min-height:28px}
body.dragging-task,body.dragging-task *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
body.dragging-task{overflow:hidden}
.item.task.is-dragging{opacity:.35}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;margin:0;padding:10px 12px;width:min(340px,calc(100vw - 32px));
  box-shadow:0 10px 30px rgba(20,20,50,.22);opacity:.96;transform:rotate(2deg);background:var(--card);
  border:1px solid var(--line);border-radius:12px;direction:rtl;font-weight:600;word-break:break-word}
.today-ph{height:6px;margin:6px 0;border-radius:99px;background:var(--pri);list-style:none;padding:0;border:0}
@media (prefers-color-scheme:dark){
  .today-board{background:linear-gradient(180deg,#2a2114 0%,var(--card) 42px);border-color:#8a6914}
  .today-board .card-head h2{color:#fbbf24}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="sync busy" id="sync" title="מסנכרן…"></span>
    <div class="brand grow"><b>סנכרון יומי</b><span>דרור · שחר · 15 דקות</span></div>
    <div class="seg" id="who" role="group" aria-label="מי אני">
      <button type="button" data-act="setMe" data-v="Dror">דרור</button>
      <button type="button" data-act="setMe" data-v="Shachar">שחר</button>
    </div>
  </div>
</header>

<main id="app">
  <section class="tab" id="tab-today"></section>
  <section class="tab" id="tab-agenda"></section>
  <section class="tab" id="tab-tasks"></section>
  <section class="tab" id="tab-summaries"></section>
</main>

<button class="fab" id="fab" hidden aria-label="הוספה">+</button>

<nav class="bottom">
  <div class="nav-in">
    <button type="button" data-act="tab" data-v="today"><span class="ic">🏠</span>היום</button>
    <button type="button" data-act="tab" data-v="agenda"><span class="ic">🗂️</span>אג׳נדה<span class="badge blue" id="bAgenda" hidden></span></button>
    <button type="button" data-act="tab" data-v="tasks"><span class="ic">✅</span>משימות<span class="badge" id="bTasks" hidden></span></button>
    <button type="button" data-act="tab" data-v="summaries"><span class="ic">📝</span>סיכומים</button>
  </div>
</nav>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
'use strict';

/* ---------------- Config ---------------- */
var KEY = (function () {
  var LS = 'ds_sync_key', h = (location.hash || '').replace(/^#(k=)?/, '').trim();
  try {
    if (h) {
      localStorage.setItem(LS, h);
      if (history.replaceState) history.replaceState(null, '', location.pathname + location.search); // hide key from the address bar
      return h;
    }
    return localStorage.getItem(LS) || '';
  } catch (e) { return h; } // storage blocked (some private modes): key from the link still works for this visit
})();
var API_URL = "https://script.google.com/macros/s/AKfycbypWC3zxI6NALV-xX_SbqJMmt3Lcr5nDQzuo-UlQIdAKKyOhYPFM-T-E5Vh9b7w2UVfCA/exec";
var TZ = 'America/New_York';
if (!window.CSS) window.CSS = {};
if (!CSS.escape) CSS.escape = function (s) { return String(s).replace(/[^a-zA-Z0-9_-]/g, function (c) { return '\\' + c; }); };
var TOTAL_SEC = 15 * 60;
var REFRESH_MS = 60000;

var PEOPLE = { Dror: 'דרור', Shachar: 'שחר', Both: 'שנינו', Bot: 'אוטומציה' };
var OWNER_OPTS = { Dror: 'דרור', Shachar: 'שחר', Both: 'שנינו' };
var TASK_STATUS = { 'open': 'פתוחה', 'in progress': 'בתהליך', 'done': 'הושלמה' };
var MEETING_STATUS = { proposed: 'הוצעה', confirmed: 'מאושרת', done: 'התקיימה', cancelled: 'בוטלה' };
var SOURCE = { manual: 'ידני', email: 'מייל', meeting: 'פגישה', task: 'משימה', tldv: 'tl;dv', teams: 'Teams' };
var SOURCE_ICON = { email: '✉️', meeting: '📅', task: '✅', tldv: '🎙️', teams: '💬' };

var S = {
  data: { meetings: [], agenda: [], tasks: [], summaries: [] },
  loaded: false, error: '',
  me: localStorage.getItem('sync.me') || '',
  tab: localStorage.getItem('sync.tab') || 'today',
  f: { owner: localStorage.getItem('sync.fOwner') || 'all', status: localStorage.getItem('sync.fStatus') || 'active' },
  pending: 0, refreshing: false, rev: 0, lastSync: 0, needRefresh: false,
  modalSubmit: null, openSum: {}, alert: {},
  sumQ: '', sumMonth: localStorage.getItem('sync.sumMonth') || '', sumLimit: 25
};

/* ---------------- Helpers ---------------- */
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function safeUrl(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }
function person(p) { return PEOPLE[p] || p || ''; }
function me() { return S.me || 'Unknown'; }
function tmpId() { return 'tmp_' + Math.random().toString(36).slice(2, 10); }
function isTmp(id) { return String(id || '').indexOf('tmp_') === 0; }
function nowStamp() { var p = partsInTz(new Date(), TZ); return p.year + '-' + p.month + '-' + p.day + ' ' + p.hour + ':' + p.minute + ':' + p.second; }
function errMsg(e) { return (e && (e.message || String(e))) || 'שגיאה'; }
function opt(map, sel) {
  return Object.keys(map).map(function (v) {
    return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(map[v]) + '</option>';
  }).join('');
}
function splitLines(s) {
  return String(s || '').split(/\n+/).map(function (x) { return x.replace(/^\s*[-•*]\s*/, '').trim(); }).filter(Boolean);
}
function meetingKeyOf(date, time, title) { return [date || '', time || '', String(title || '').trim()].join('|'); }
function summaryByKey(k) { return k ? S.data.summaries.filter(function (x) { return x.meetingKey === k; })[0] : null; }
function sumSort(a, b) { return ((b.date || '') + (b.time || '')).localeCompare((a.date || '') + (a.time || '')); }
function monthLabel(ym) {
  var a = ym.split('-').map(Number);
  return new Date(Date.UTC(a[0], a[1] - 1, 15)).toLocaleDateString('he-IL', { month: 'long', year: 'numeric', timeZone: 'UTC' });
}
function byId(coll, id) { return S.data[coll].filter(function (x) { return x.id === id; })[0]; }

/* Dates: all business dates/times are New York wall-clock. */
function partsInTz(d, tz) {
  var f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit',
    day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  var o = {};
  f.formatToParts(d).forEach(function (p) { o[p.type] = p.value; });
  if (o.hour === '24') o.hour = '00';
  return o;
}
function todayStr() { var p = partsInTz(new Date(), TZ); return p.year + '-' + p.month + '-' + p.day; }
function tzOffsetMin(d, tz) {
  var p = partsInTz(d, tz);
  var asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
  return Math.round((asUtc - Math.floor(d.getTime() / 1000) * 1000) / 60000);
}
function nyInstant(date, time) {
  if (!date) return null;
  var a = date.split('-').map(Number), t = String(time || '00:00').split(':').map(Number);
  var guess = Date.UTC(a[0], a[1] - 1, a[2], t[0] || 0, t[1] || 0);
  var off = tzOffsetMin(new Date(guess), TZ), inst = guess - off * 60000;
  var off2 = tzOffsetMin(new Date(inst), TZ);
  if (off2 !== off) inst = guess - off2 * 60000;
  return new Date(inst);
}
function addDays(s, n) { var a = s.split('-').map(Number); return new Date(Date.UTC(a[0], a[1] - 1, a[2] + n)).toISOString().slice(0, 10); }
function weekday(s) { var a = s.split('-').map(Number); return new Date(Date.UTC(a[0], a[1] - 1, a[2])).getUTCDay(); }
function nextWorkday(s) { var x = s; do { x = addDays(x, 1); } while (weekday(x) === 0 || weekday(x) === 6); return x; }
function fmtDate(s, o) {
  if (!s) return '';
  var a = s.split('-').map(Number);
  if (!a[0] || !a[1] || !a[2]) return s;
  return new Date(Date.UTC(a[0], a[1] - 1, a[2], 12)).toLocaleDateString('he-IL',
    Object.assign({ weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }, o || {}));
}
function shortDate(s) { return fmtDate(s, { weekday: 'short', day: 'numeric', month: 'numeric' }); }
function relDay(s) {
  var t = todayStr();
  if (s === t) return 'היום';
  if (s === addDays(t, 1)) return 'מחר';
  if (s === addDays(t, -1)) return 'אתמול';
  return fmtDate(s);
}
function dueLabel(s) { var r = relDay(s); return /^(היום|מחר|אתמול)$/.test(r) ? r : shortDate(s); }
function localTime(inst) {
  var vt = '';
  try { vt = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { vt = ''; }
  if (!vt || tzOffsetMin(inst, vt) === tzOffsetMin(inst, TZ)) return '';
  return inst.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });
}
function untilLabel(inst) {
  var diff = Math.round((inst.getTime() - Date.now()) / 60000);
  if (diff < -20) return '';
  if (diff <= 0) return 'עכשיו';
  if (diff < 60) return 'בעוד ' + diff + ' דק׳';
  var h = Math.floor(diff / 60), m = diff % 60;
  if (h < 24) return 'בעוד ' + h + ' שע׳' + (m ? ' ו-' + m + ' דק׳' : '');
  return '';
}
function fmtClock(sec) {
  var neg = sec < 0, s = neg ? Math.floor(-sec) : Math.ceil(sec);
  return (neg ? '+' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function fmtMin(sec) { var m = sec / 60; return (m % 1 ? m.toFixed(1) : m) + ' דק׳'; }
function slotTime(s) { var m = String(s).match(/(\d{1,2}:\d{2})/); return m ? m[1].padStart(5, '0') : s; }

/* ---------------- Server ---------------- */
function call(action, payload) {
  // Standalone build: talks to the Apps Script JSON API with fetch (no Google cookies, no google.script.run).
  var body = JSON.stringify({ key: KEY, action: action, data: payload || {} });
  function once() {
    return fetch(API_URL, {
      method: 'POST', body: body, credentials: 'omit', redirect: 'follow', cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    }).then(function (r) {
      if (!r.ok) throw new Error('שגיאת שרת ' + r.status);
      return r.text();
    }).then(function (t) {
      var j; try { j = JSON.parse(t); } catch (e) { throw new Error('תשובה לא תקינה מהשרת'); }
      if (!j.ok) throw new Error(j.error || 'שגיאה');
      return j.result;
    });
  }
  var readOnly = { ping: 1, getAll: 1, getMeeting: 1, getSummary: 1 };
  return once().catch(function (e) {
    if (!readOnly[action]) throw e; // never auto-retry writes
    return new Promise(function (res) { setTimeout(res, 800); }).then(once);
  });
}

function refresh() {
  if (S.pending > 0 || S.refreshing || S.dragging) return;
  var a = document.activeElement;
  if (S.loaded && a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('#app').contains(a) && a.value) return; // don't wipe typing
  var rev = S.rev;
  S.refreshing = true; setSync();
  call('getAll').then(function (res) {
    if (S.pending > 0 || S.rev !== rev) return; // local change in flight; next cycle syncs
    S.data = { meetings: res.meetings || [], agenda: res.agenda || [], tasks: res.tasks || [], summaries: res.summaries || [] };
    S.loaded = true; S.error = ''; S.lastSync = Date.now();
    renderAll();
  }).catch(function (e) {
    if (!S.loaded) { S.error = errMsg(e); renderAll(); }
    else toast('הרענון נכשל: ' + errMsg(e), true);
  }).then(function () { S.refreshing = false; setSync(); });
}

/** Optimistic mutation: apply locally -> render -> call server -> reconcile, or roll back on error. */
function mutate(coll, apply, action, payload, opts) {
  opts = opts || {};
  var snap = JSON.stringify(S.data[coll]);
  S.rev++;
  apply();
  S.pending++;
  renderAll(); setSync();
  return call(action, payload).then(function (res) {
    var id = opts.tempId || (res && res.id);
    if (res && res.id && id) {
      var arr = S.data[coll], i = -1;
      for (var k = 0; k < arr.length; k++) if (arr[k].id === id || arr[k].id === res.id) { i = k; break; }
      var rec = Object.assign({}, res); delete rec.createdTasks; delete rec.duplicate;
      if (i >= 0) arr[i] = rec; else arr.push(rec);
    }
    if (opts.after) opts.after(res);
    return res;
  }).catch(function (e) {
    S.data[coll] = JSON.parse(snap);
    S.needRefresh = true;
    toast((opts.failMsg || 'השמירה נכשלה') + ': ' + errMsg(e), true);
  }).then(function (r) {
    S.pending--; S.rev++;
    renderAll(); setSync();
    if (S.pending === 0 && S.needRefresh) { S.needRefresh = false; refresh(); }
    return r;
  });
}

/* ---------------- Derived data ---------------- */
function byDateTime(a, b) { return ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || '')); }

function nextMeeting() {
  var t = todayStr();
  var list = S.data.meetings.filter(function (m) {
    return m.date && m.date >= t && m.status !== 'done' && m.status !== 'cancelled';
  }).sort(byDateTime);
  for (var i = 0; i < list.length; i++) {
    var inst = nyInstant(list[i].date, list[i].time || '23:59');
    var dur = (+list[i].durationMin || 15) + 30;
    if (inst.getTime() + dur * 60000 > Date.now() || i === list.length - 1) return list[i];
  }
  return null;
}
function lastMeetingDate() {
  var t = todayStr();
  var d = S.data.meetings.filter(function (m) { return m.date && m.date <= t && m.status !== 'cancelled'; }).sort(byDateTime).pop();
  return d ? d.date : t;
}
function defaultAgendaDate() { var m = nextMeeting(); return m ? m.date : nextWorkday(todayStr()); }
function agendaGroupKey(x, m) { return !x.date || (m && x.date <= m.date) || (!m && x.date <= todayStr()) ? 'next' : x.date; }

function agendaSort(a, b) {
  var oa = +a.order || 9999, ob = +b.order || 9999;
  if (oa !== ob) return oa - ob;
  return String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
}
/** Open items for a meeting: undated, dated that day, or carried over from earlier days. */
function agendaFor(m) {
  var d = m ? m.date : todayStr();
  return S.data.agenda.filter(function (a) { return a.status !== 'discussed' && (!a.date || a.date <= d); }).sort(agendaSort);
}
/** Timebox: explicit minutes win, the rest of the 15 minutes is split evenly (min 1 min, 30s steps). */
function allocate(items) {
  var fixed = 0, free = 0;
  items.forEach(function (a) { var n = +a.minutes; if (n > 0) fixed += n * 60; else free++; });
  var rem = Math.max(TOTAL_SEC - fixed, 0);
  var each = free ? Math.max(60, Math.floor(rem / free / 30) * 30) : 0;
  var map = {}, out = [], total = 0;
  items.forEach(function (a) {
    var sec = +a.minutes > 0 ? +a.minutes * 60 : each;
    map[a.id] = sec; total += sec;
    out.push({ id: a.id, title: a.title, sec: sec });
  });
  return { items: out, map: map, total: total };
}
function isOverdue(t) { return t.status !== 'done' && !!t.dueDate && t.dueDate < todayStr(); }
function taskSort(a, b) {
  var da = a.status === 'done' ? 1 : 0, db = b.status === 'done' ? 1 : 0;
  if (da !== db) return da - db;
  var x = a.dueDate || '9999', y = b.dueDate || '9999';
  if (x !== y) return x.localeCompare(y);
  return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
}
function ownerMatch(t, f) {
  if (f === 'all') return true;
  if (f === 'me') return t.owner === S.me || t.owner === 'Both';
  return t.owner === f;
}
function statusMatch(t, f) {
  if (f === 'all') return true;
  if (f === 'active') return t.status !== 'done';
  return t.status === f;
}

/* ---------------- Rendering ---------------- */
function renderAll() {
  renderHeader();
  document.querySelectorAll('.tab').forEach(function (el) { el.classList.toggle('on', el.id === 'tab-' + S.tab); });
  document.querySelectorAll('.nav-in button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === S.tab); });
  if (!S.loaded) {
    $('#tab-' + S.tab).innerHTML = S.error
      ? '<div class="card err"><h3>לא הצלחנו לטעון</h3><p class="muted">' + esc(S.error) + '</p><button class="btn primary" data-act="retry">נסו שוב</button></div>'
      : '<div class="skel"></div><div class="skel" style="height:160px"></div><div class="skel"></div>';
    $('#fab').hidden = true;
    return;
  }
  renderToday(); renderAgenda(); renderTasks(); renderSummaries(); renderBadges();
  $('#fab').hidden = !(S.tab === 'tasks' || S.tab === 'summaries' || S.tab === 'agenda');
  tick();
}

function renderHeader() {
  document.querySelectorAll('#who button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === S.me); });
}
function setSync() {
  var el = $('#sync');
  el.className = 'sync' + (S.pending || S.refreshing ? ' busy' : '') + (S.error && !S.loaded ? ' bad' : '');
  el.title = S.pending ? 'שומר…' : S.refreshing ? 'מרענן…' :
    (S.lastSync ? 'עודכן ' + new Date(S.lastSync).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : '');
}
function renderBadges() {
  var open = agendaFor(nextMeeting()).length, od = S.data.tasks.filter(isOverdue).length;
  var bA = $('#bAgenda'), bT = $('#bTasks');
  bA.hidden = !open; bA.textContent = open;
  bT.hidden = !od; bT.textContent = od;
}

function agendaRow(a, sec, o) {
  o = o || {};
  var link = safeUrl(a.link), discussed = a.status === 'discussed';
  var src = a.source && a.source !== 'manual'
    ? '<span class="chip">' + (SOURCE_ICON[a.source] || '•') + ' ' + esc(SOURCE[a.source] || a.source) + '</span>' : '';
  return '<li class="item' + (a._pending ? ' pending' : '') + (discussed ? ' discussed' : '') + '">' +
    '<button class="check' + (discussed ? ' on' : '') + '" data-act="' + (discussed ? 'agendaReopen' : 'agendaDone') +
      '" data-id="' + esc(a.id) + '" aria-label="' + (discussed ? 'החזר לאג׳נדה' : 'סמן כנדון') + '">✓</button>' +
    '<div class="item-body" data-act="agendaEdit" data-id="' + esc(a.id) + '">' +
      '<div class="item-title">' + esc(a.title) + '</div>' +
      '<div class="meta">' + src +
        (a.from ? '<span class="chip gray">' + esc(a.from) + '</span>' : '') +
        (link ? '<a class="chip" href="' + esc(link) + '" target="_blank" rel="noopener">פתח ↗</a>' : '') +
        (o.showDate && a.date && a.date < todayStr() && !discussed ? '<span class="chip warn">נדחה מ-' + esc(shortDate(a.date)) + '</span>' : '') +
        (a.createdBy ? '<span class="muted">· ' + esc(person(a.createdBy)) + '</span>' : '') +
      '</div>' +
      (a.details ? '<div class="item-notes">' + esc(a.details) + '</div>' : '') +
    '</div>' +
    (sec ? '<span class="tbox" title="זמן מוקצב">' + fmtMin(sec) + '</span>' : '') +
    (o.reorder ? '<div class="reorder"><button class="icon-btn sm" data-act="agendaMove" data-dir="-1" data-id="' + esc(a.id) +
      '" aria-label="למעלה">▲</button><button class="icon-btn sm" data-act="agendaMove" data-dir="1" data-id="' + esc(a.id) +
      '" aria-label="למטה">▼</button></div>' : '') +
  '</li>';
}

function taskRow(t, opts) {
  opts = opts || {};
  var od = isOverdue(t), done = t.status === 'done';
  var soon = !done && t.dueDate && !od && t.dueDate <= addDays(todayStr(), 2);
  var inToday = !!opts.inToday, onToday = isOnTodayList(t);
  var pin = '';
  if (!done) {
    if (inToday) pin = '<button type="button" class="icon-btn today-x" data-act="todayRemove" data-id="' + esc(t.id) + '" aria-label="הסר מהיום">✕</button>';
    else if (onToday) pin = '<span class="chip gray" title="כבר בהיום">☀ היום</span>';
    else pin = '<button type="button" class="today-pin" data-act="todayAdd" data-id="' + esc(t.id) + '">☀ להיום</button>';
  }
  return '<li class="item task' + (od ? ' overdue' : '') + (done ? ' done' : '') + (t._pending ? ' pending' : '') + '" data-id="' + esc(t.id) + '">' +
    '<button class="check' + (done ? ' on' : '') + '" data-act="toggleTask" data-id="' + esc(t.id) + '" aria-label="' +
      (done ? 'פתח מחדש' : 'סמן כהושלם') + '">✓</button>' +
    '<div class="item-body" data-act="editTask" data-id="' + esc(t.id) + '">' +
      '<div class="item-title">' + esc(t.title) + '</div>' +
      '<div class="meta"><span class="chip own-' + esc(t.owner) + '">' + esc(person(t.owner)) + '</span>' +
        (t.dueDate ? '<span class="chip ' + (od ? 'bad' : soon ? 'warn' : 'gray') + '">' + (od ? '⚠ באיחור · ' : '📅 ') + esc(dueLabel(t.dueDate)) + '</span>' : '') +
        (t.status === 'in progress' ? '<span class="chip">⏳ בתהליך</span>' : '') +
        (t.assignee ? '<span class="chip gray">👤 ' + esc(t.assignee) + '</span>' : '') +
        (t._noMeeting || taskSource(t) ? '' : taskMeetingLabel(t)) +
        (inToday ? '' : pin) +
      '</div>' +
      (splitNotes(t.notes).user ? '<div class="item-notes">' + esc(splitNotes(t.notes).user) + '</div>' : '') +
      srcHtml(t) +
    '</div>' +
    '<div class="task-tools">' +
      (inToday ? pin : '') +
      (done ? '' : '<button type="button" class="drag-handle" data-drag="1" data-id="' + esc(t.id) + '" aria-label="גרור להיום" title="גרור אל משימות להיום">⠿</button>') +
    '</div></li>';
}


/* ---------------- Task source ("מקור") ----------------
   Stored at the end of task.notes after the marker line "⟦מקור⟧", so no backend change is needed:
     ⟦מקור⟧
     שיחה: <title> · <YYYY-MM-DD> <HH:MM> (שעון ניו יורק)   | מייל: <subject> · <date> · מאת <sender> | נוסף ידנית ע״י <X> · <date>
     tl;dv: <url>        (or  קישור: <url>)
     הקשר: <1-2 Hebrew sentences>
     ציטוט: "<quote>" (<speaker>, <mm:ss>)
   Users only see/edit the text above the marker; the block is kept on save. */
var SRC_MARK = '⟦מקור⟧';
var TODAY_MARK = '⟦היום⟧';
function splitSrc(notes) { var p = splitNotes(notes); return { user: p.user, block: p.block }; }

function parseSrc(block) {
  var o = {};
  String(block || '').split('\n').forEach(function (l) {
    var m = l.match(/^(שיחה|מייל|נוסף ידנית ע״י|tl;dv|קישור|הקשר|ציטוט):?\s*(.*)$/);
    if (!m) return;
    if (m[1] === 'שיחה') { o.kind = 'meeting'; o.head = m[2]; }
    else if (m[1] === 'מייל') { o.kind = 'email'; o.head = m[2]; }
    else if (m[1] === 'נוסף ידנית ע״י') { o.kind = 'manual'; o.head = m[2]; }
    else if (m[1] === 'tl;dv' || m[1] === 'קישור') o.url = m[2];
    else if (m[1] === 'הקשר') o.ctx = m[2];
    else if (m[1] === 'ציטוט') o.quote = m[2];
  });
  return o;
}

/* ---------------- Today list ("משימות להיום") ----------------
   Stored as a line in task.notes (no backend change; updateTask drops unknown fields):
     ⟦היום⟧ YYYY-MM-DD [order]     pinned to that New York date (order is optional)
     ⟦היום⟧ לא YYYY-MM-DD         hidden from auto-include (overdue / due today) for that date
   The line sits above the ⟦מקור⟧ block, is hidden from the notes field, and is kept on save.
   A pin for a past date drops off automatically the next day. */
function parseTodayLine(line) {
  var s = String(line || '').trim();
  if (s.indexOf(TODAY_MARK) !== 0) return null;
  var rest = s.slice(TODAY_MARK.length).trim();
  var hide = rest.match(/^לא\s+(\d{4}-\d{2}-\d{2})\s*$/);
  if (hide) return { dismissed: hide[1] };
  var pin = rest.match(/^(\d{4}-\d{2}-\d{2})(?:\s+(\d+))?\s*$/);
  if (pin) return { date: pin[1], order: pin[2] ? Number(pin[2]) : null };
  return null;
}
function splitNotes(notes) {
  notes = String(notes || '');
  var i = notes.indexOf(SRC_MARK);
  var head = i < 0 ? notes : notes.slice(0, i);
  var block = i < 0 ? '' : notes.slice(i).replace(/^\s+/, '');
  var today = null, user = [];
  head.split('\n').forEach(function (l) {
    if (/^\s*⟦היום⟧/.test(l)) { var p = parseTodayLine(l); if (p) today = p; }
    else user.push(l);
  });
  return { user: user.join('\n').replace(/^\s+|\s+$/g, ''), today: today, block: block };
}
function joinNotes(user, today, block) {
  var parts = [];
  if (today) {
    if (today.dismissed) parts.push(TODAY_MARK + ' לא ' + today.dismissed);
    else if (today.date) parts.push(TODAY_MARK + ' ' + today.date + (today.order > 0 ? ' ' + today.order : ''));
  }
  if (user) parts.push(user);
  if (block) parts.push(String(block).replace(/^\s+/, ''));
  return parts.join('\n\n');
}
function todayMeta(t) { return t ? splitNotes(t.notes).today : null; }
function isOnTodayList(t) {
  if (!t || t.status === 'done') return false;
  var d = todayStr(), m = todayMeta(t);
  if (m && m.dismissed === d) return false;
  if (m && m.date === d) return true;
  return !!(t.dueDate && t.dueDate <= d);
}
function todaySort(a, b) {
  var d = todayStr(), ma = todayMeta(a) || {}, mb = todayMeta(b) || {};
  var pa = ma.date === d ? (ma.order || 9999) : 10000;
  var pb = mb.date === d ? (mb.order || 9999) : 10000;
  if (pa !== pb) return pa - pb;
  return taskSort(a, b);
}
function todayTasks() { return S.data.tasks.filter(isOnTodayList).sort(todaySort); }
function todayOwnerDefault() { return S.me || 'Both'; }
function todayBoardHtml() {

function notesWithToday(t, meta) {
  var p = splitNotes(t && t.notes);

}
function applyTodayMeta(t, meta) {
  if (!t || guardTemp(t.id)) return;
  var notes = notesWithToday(t, meta);
  mutate('tasks', function () { var r = byId('tasks', t.id); if (r) { r.notes = notes; r.updatedAt = nowStamp(); } },
    'updateTask', { id: t.id, notes: notes });
}
function addToToday(t, order) {

  applyTodayMeta(t, { date: todayStr(), order: order || null });
  toast('נוסף להיום ✓');
}
function removeFromToday(t) {
  if (!t) return;
  var d = todayStr();

  applyTodayMeta(t, meta);
  toast('הוסר מהיום');

function reorderToday(ids) {
  if (!ids || !ids.length) return;
  if (ids.some(function (id) { return isTmp(id); })) { toast('רגע, עדיין שומר…'); return; }
  var d = todayStr();
  var ops = [], snap = JSON.stringify(S.data.tasks);
  S.rev++;
  ids.forEach(function (id, n) {
    var t = byId('tasks', id); if (!t) return;
    var notes = notesWithToday(t, { date: d, order: n + 1 });
    t.notes = notes; t.updatedAt = nowStamp();
    ops.push({ action: 'updateTask', data: { id: id, notes: notes } });
  });
  if (!ops.length) return;
  S.pending++; renderAll(); setSync();
  call('bulk', { ops: ops }).then(function () { return true; }).catch(function (e) {
    S.data.tasks = JSON.parse(snap);
    toast('לא הצלחנו לשמור את הסדר: ' + errMsg(e), true);
  }).then(function () { S.pending--; S.rev++; renderAll(); setSync(); });
}
function addQuickToday(d) {

/* Pointer drag (mouse + touch). HTML5 DnD is skipped because it does not work on iOS. */
var drag = null;
function clearTodayPlaceholder() {
  document.querySelectorAll('.today-ph').forEach(function (el) { el.remove(); });
  document.querySelectorAll('.today-board').forEach(function (el) { el.classList.remove('over'); });
}
function endDrag() {
  if (!drag) return;
  if (drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
  document.querySelectorAll('.item.task.is-dragging').forEach(function (el) { el.classList.remove('is-dragging'); });
  clearTodayPlaceholder();
  document.body.classList.remove('dragging-task');
  S.dragging = false;
  if (drag.moved) {
    // swallow the click that follows a drag
    var swallow = function (e) { e.stopPropagation(); e.preventDefault(); document.removeEventListener('click', swallow, true); };
    document.addEventListener('click', swallow, true);
    setTimeout(function () { document.removeEventListener('click', swallow, true); }, 400);
  }
  drag = null;
}
function dropIndexAt(board, clientY, skipId) {
  var list = board.querySelector('.today-list');
  if (!list) return 0;
  var items = [].slice.call(list.querySelectorAll('.item.task')).filter(function (el) { return el.dataset.id !== skipId; });
  for (var i = 0; i < items.length; i++) {
    var r = items[i].getBoundingClientRect();
    if (clientY < r.top + r.height / 2) return i;
  }
  return items.length;
}
function showPlaceholder(board, idx) {
  clearTodayPlaceholder();
  if (!board) return;
  board.classList.add('over');
  var ph = document.createElement('li');
  ph.className = 'today-ph';
  var list = board.querySelector('.today-list');
  if (!list) {
    var empty = board.querySelector('.today-empty');
    if (empty) empty.insertAdjacentElement('beforebegin', ph);
    else board.insertBefore(ph, board.querySelector('.today-add'));
    return;
  }
  var items = [].slice.call(list.querySelectorAll('.item.task')).filter(function (el) { return !el.classList.contains('is-dragging'); });
  if (idx >= items.length) list.appendChild(ph);
  else list.insertBefore(ph, items[idx]);
}
function onTodayPointerDown(e) {
  if (e.button != null && e.button !== 0) return;
  var handle = e.target.closest && e.target.closest('[data-drag]');
  if (!handle || handle.closest('.modal')) return;
  var id = handle.getAttribute('data-id');
  var t = byId('tasks', id);
  if (!t || t.status === 'done' || isTmp(id)) return;
  drag = { id: id, startX: e.clientX, startY: e.clientY, pointerId: e.pointerId, moved: false, ghost: null, fromToday: !!(handle.closest && handle.closest('.today-board')) };
  S.dragging = true;
  try { handle.setPointerCapture(e.pointerId); } catch (err) {}
}
function onTodayPointerMove(e) {
  if (!drag || (drag.pointerId != null && e.pointerId !== drag.pointerId)) return;
  var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if (!drag.moved) {
    if (dx * dx + dy * dy < 64) return;
    drag.moved = true;
    var src = document.querySelector('.tab.on .item.task[data-id="' + CSS.escape(drag.id) + '"]') ||
              document.querySelector('.item.task[data-id="' + CSS.escape(drag.id) + '"]');
    if (src) src.classList.add('is-dragging');
    var t = byId('tasks', drag.id);
    var g = document.createElement('div');
    g.className = 'drag-ghost';
    g.textContent = t ? t.title : '';
    document.body.appendChild(g);
    drag.ghost = g;
    document.body.classList.add('dragging-task');
  }
  e.preventDefault();
  if (drag.ghost) {
    drag.ghost.style.left = (e.clientX - 40) + 'px';
    drag.ghost.style.top = (e.clientY - 20) + 'px';
  }
  var board = activeTodayBoard();
  if (board) {
    var r = board.getBoundingClientRect();
    var pad = 28;
    if (e.clientY >= r.top - pad && e.clientY <= r.bottom + pad && e.clientX >= r.left - pad && e.clientX <= r.right + pad) {
      showPlaceholder(board, dropIndexAt(board, e.clientY, drag.id));
    } else clearTodayPlaceholder();
  }
}
function onTodayPointerUp(e) {
  if (!drag || (drag.pointerId != null && e.pointerId !== drag.pointerId)) return;
  var info = drag, t = byId('tasks', info.id);
  var board = activeTodayBoard();
  var over = board && board.classList.contains('over');
  var idx = over ? dropIndexAt(board, e.clientY, info.id) : -1;
  var moved = info.moved;
  endDrag();
  if (!moved || !t) return;
  if (over) {
    var ids = todayTasks().map(function (x) { return x.id; }).filter(function (id) { return id !== t.id; });
    ids.splice(idx, 0, t.id);
    if (ids.length === 1 && !info.fromToday) addToToday(t);
    else reorderToday(ids);
  } else if (info.fromToday) {
    removeFromToday(t);
  }
}

function taskSource(t) {
  var p = parseSrc(splitSrc(t.notes).block), s = summaryByKey(t.meetingKey);
  if (!p.kind && s) {
    p = { kind: 'meeting', head: (s.title || 'פגישה') + ' · ' + (s.date || '') + (s.time ? ' ' + s.time : '') + ' (שעון ניו יורק)', url: s.tldvUrl };
  } else if (!p.kind && (t.createdBy === 'Dror' || t.createdBy === 'Shachar')) {
    p = { kind: 'manual', head: person(t.createdBy) + ' · ' + String(t.createdAt || '').slice(0, 10) };
  } else if (!p.kind && t.sourceMeetingDate) {
    p = { kind: 'meeting', head: 'פגישה · ' + t.sourceMeetingDate };
  }
  return p.kind ? p : null;
}
function srcHtml(t) {

  var m = head.match(/^(.*) · (\d{4}-\d{2}-\d{2})(?: (\d{1,2}:\d{2}))?(.*)$/);

/* Timer state lives in localStorage so a reload/refresh never loses it. */
function loadTimer() { try { return JSON.parse(localStorage.getItem('sync.timer') || 'null'); } catch (e) { return null; } }

function currentTimer(m) {
  var t = loadTimer(), k = m ? m.date : todayStr();
  if (t && t.k !== k && !t.running) { saveTimer(null); return null; }
  return t;
}

function timerCard(m, alloc) {

  var finished = !!t && idx >= items.length;
  return '<section class="card" id="timerCard">' +
    '<div class="card-head"><h2>⏱ טיימר 15 דקות</h2><span class="muted small" id="tmState"></span></div>' +

  var list = all.filter(function (t) { return ownerMatch(t, f.owner) && statusMatch(t, f.status); }).sort(taskSort);

/* ---------------- Timer tick + sound ---------------- */
var actx = null;
function unlockAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function beep(times) {
  times = times || 1;
  try { if (navigator.vibrate) navigator.vibrate(times > 1 ? [200, 100, 200, 100, 200] : 200); } catch (e) {}
  if (!actx) return;
  for (var i = 0; i < times; i++) {
    var o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i * 0.35;
    o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28); o.start(t0); o.stop(t0 + 0.3);
  }
}
function tick() {
  var el = $('#tmTotal');
  if (!el || S.tab !== 'today') return;
  var t = currentTimer(nextMeeting());
  var bar = $('#tmTotalBar'), st = $('#tmState');
  if (!t) { el.textContent = '15:00'; el.className = 'tm-total'; bar.style.width = '0'; st.textContent = ''; return; }
  var e = timerElapsed(t), rem = TOTAL_SEC - e;
  el.textContent = fmtClock(rem);
  el.className = 'tm-total' + (rem < 0 ? ' over' : rem < 120 ? ' warn' : '');
  $('#tmLabel').textContent = rem < 0 ? 'חריגה מהזמן' : 'נותרו לשיחה';
  bar.style.width = Math.min(100, e / TOTAL_SEC * 100) + '%';
  bar.className = rem < 0 ? 'over' : rem < 120 ? 'warn' : '';
  st.textContent = t.running ? '● פועל' : (t.idx >= t.items.length ? 'הסתיים' : 'מושהה');
  if (rem <= 0 && t.running && !S.alert.total) { S.alert.total = true; beep(3); }
  var it = t.items[t.idx];
  if (it) {
    var ie = e - t.itemStart, ir = it.sec - ie;
    $('#tmItemTitle').textContent = (t.idx + 1) + '. ' + it.title;
    var ti = $('#tmItem'); ti.textContent = fmtClock(ir); ti.className = 'tm-item-time' + (ir < 0 ? ' over' : '');
    var ib = $('#tmItemBar'); ib.style.width = Math.min(100, ie / it.sec * 100) + '%'; ib.className = ir < 0 ? 'over' : ir < 30 ? 'warn' : '';
    if (ir <= 0 && t.running && S.alert.item !== t.idx) { S.alert.item = t.idx; beep(1); }
  }
}

    toast('שלום ' + person(S.me) + ' 👋'); renderAll();
  },
  retry: function () { S.error = ''; renderAll(); refresh(); },
  closeModal: function () { closeModal(); },
  fOwner: function (d) { S.f.owner = d.v; localStorage.setItem('sync.fOwner', d.v); renderTasks(); },
  fStatus: function (d) { S.f.status = d.v; localStorage.setItem('sync.fStatus', d.v); renderTasks(); },

  todayAdd: function (d) { var t = byId('tasks', d.id); if (t) addToToday(t); },
  todayRemove: function (d) { var t = byId('tasks', d.id); if (t) removeFromToday(t); },

  newTask: function () { openTaskModal(null); },
  taskForMeeting: function (d) { openTaskModal(null, { meetingKey: d.v }); },
  sumMore: function () { S.sumLimit += 25; renderSumList(); },
  editTask: function (d) { var t = byId('tasks', d.id); if (t && !guardTemp(t.id)) openTaskModal(t); },
  toggleTask: function (d) {
    var t = byId('tasks', d.id); if (!t || guardTemp(t.id)) return;
    var st = t.status === 'done' ? 'open' : 'done';
    mutate('tasks', function () { var r = byId('tasks', d.id); r.status = st; r.updatedAt = nowStamp(); }, 'updateTask', { id: t.id, status: st });
    if (st === 'done') toast('כל הכבוד ✓');
  },
  deleteTask: function (d) { removeRec('tasks', 'deleteTask', d.id, 'המשימה'); },

  agendaDone: function (d) { setAgendaStatus(d.id, 'discussed'); },
  agendaReopen: function (d) { setAgendaStatus(d.id, 'open'); },
  agendaEdit: function (d) { var a = byId('agenda', d.id); if (a && !guardTemp(a.id)) openAgendaModal(a); },
  deleteAgenda: function (d) { removeRec('agenda', 'deleteAgendaItem', d.id, 'הנושא'); },
  agendaMove: function (d) {
    var a = byId('agenda', d.id); if (!a || guardTemp(a.id)) return;
    var m = nextMeeting(), k = agendaGroupKey(a, m);
    var group = S.data.agenda.filter(function (x) { return x.status !== 'discussed' && agendaGroupKey(x, m) === k; }).sort(agendaSort);
    var i = group.indexOf(a), j = i + Number(d.dir);
    if (j < 0 || j >= group.length) return;
    if (group.some(function (x) { return isTmp(x.id); })) { toast('רגע, עדיין שומר…'); return; }
    group.splice(i, 1); group.splice(j, 0, a);
    var ids = group.map(function (x) { return x.id; });
    mutate('agenda', function () {
      ids.forEach(function (id, n) { var r = byId('agenda', id); if (r) r.order = String(n + 1); });
    }, 'reorderAgenda', { ids: ids });
  },

  meetingEdit: function (d) { var m = d.id ? byId('meetings', d.id) : null; if (m && guardTemp(m.id)) return; openMeetingModal(m); },
  deleteMeeting: function (d) { removeRec('meetings', 'deleteMeeting', d.id, 'הפגישה'); },
  pickSlot: function (d) {
    var m = nextMeeting(); if (!m || guardTemp(m.id)) return;
    mutate('meetings', function () { var r = byId('meetings', m.id); r.time = d.v; r.pickedBy = me(); },
      'upsertMeeting', { id: m.id, time: d.v, pickedBy: me() });
    toast('נבחרה השעה ' + d.v + ' · הזימון יישלח בהמשך');
  },

  summaryEdit: function (d) { var s = byId('summaries', d.id); if (s && !guardTemp(s.id)) openSummaryModal(s); },
  deleteSummary: function (d) { removeRec('summaries', 'deleteSummary', d.id, 'הסיכום'); },

  timerStart: function () {
    unlockAudio();
    var m = nextMeeting(), t = currentTimer(m);
    if (!t) {
      var alloc = allocate(agendaFor(m));
      t = { k: m ? m.date : todayStr(), items: alloc.items.length ? alloc.items : [{ id: '', title: 'שיחה פתוחה', sec: TOTAL_SEC }],
        idx: 0, base: 0, itemStart: 0, running: false, startedAt: 0 };
      S.alert = {};
    }
    t.running = true; t.startedAt = Date.now(); saveTimer(t); renderToday(); tick();
  },
  timerPause: function () {
    var t = loadTimer(); if (!t) return;
    t.base = timerElapsed(t); t.running = false; saveTimer(t); renderToday(); tick();
  },
  timerNext: function () {
    var t = loadTimer(); if (!t) return;
    var it = t.items[t.idx], rec = it && it.id ? byId('agenda', it.id) : null;
    t.idx++; t.itemStart = timerElapsed(t);
    if (t.idx >= t.items.length) { t.base = timerElapsed(t); t.running = false; toast('סיימתם את האג׳נדה 🎉'); }
    saveTimer(t);
    if (rec && rec.status !== 'discussed' && !isTmp(rec.id)) setAgendaStatus(rec.id, 'discussed'); // also re-renders
    else renderToday();
    tick();
  },
  timerReset: function () {
    var t = loadTimer();
    if (t && t.running && !confirm('לאפס את הטיימר?')) return;
    saveTimer(null); S.alert = {}; renderToday(); tick();
  }
};

/* ---------------- Events ---------------- */
document.addEventListener('click', function (e) {
  if (e.target.closest('a[href]')) return; // let links open normally
  if (e.target.closest('[data-stop]')) return; // source box: native <details> toggle
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('submit', function (e) {
  var f = e.target;
  e.preventDefault();
  if (f.id === 'modalForm') {
    var cb = S.modalSubmit;
    if (!cb) return;
    var r = cb(formData(f));
    if (r !== false) closeModal();
    return;
  }
  var d = formData(f);
  if (f.dataset.form === 'quickAgenda') { f.reset(); addAgenda(d); }
  else if (f.dataset.form === 'agendaAdd') { f.reset(); addAgenda(d); toast('נוסף לאג׳נדה ✓'); }
  else if (f.dataset.form === 'quickToday') { f.reset(); addQuickToday(d); }
});
document.addEventListener('toggle', function (e) {
  var el = e.target;
  if (!el || !el.dataset || !el.dataset.sid) return;
  S.openSum[el.dataset.sid] = el.open;
  if (el.open && !el.querySelector('.sum-body')) {
    var s = byId('summaries', el.dataset.sid);
    if (s) {
      var tasks = S.data.tasks.filter(function (t) { return t.meetingKey && t.meetingKey === s.meetingKey; }).sort(taskSort);
      el.insertAdjacentHTML('beforeend', summaryBody(s, tasks, splitLines(s.summaryBullets), splitLines(s.decisions), safeUrl(s.tldvUrl)));
    }
  }
}, true);
$('#modal').addEventListener('click', function (e) { if (e.target === this && !this.dataset.lock) closeModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#modal').hidden && !$('#modal').dataset.lock) closeModal(); });
$('#fab').addEventListener('click', function () {
  if (S.tab === 'tasks') openTaskModal(null);
  else if (S.tab === 'summaries') openSummaryModal(null);
  else if (S.tab === 'agenda') { var i = $('#tab-agenda input[name=title]'); if (i) { i.scrollIntoView({ block: 'center' }); i.focus(); } }
});
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && Date.now() - S.lastSync > 20000) refresh();
});
document.addEventListener('pointerdown', onTodayPointerDown);
document.addEventListener('pointermove', onTodayPointerMove, { passive: false });
document.addEventListener('pointerup', onTodayPointerUp);
document.addEventListener('pointercancel', onTodayPointerUp);


function showKeyPrompt() {
  document.body.innerHTML =
    '<div dir="rtl" style="font-family:system-ui,Arial,sans-serif;max-width:420px;margin:12vh auto;padding:24px;text-align:center">' +
    '<h2 style="margin:0 0 8px">דרור · שחר · סנכרון יומי</h2>' +
    '<p style="color:#555;margin:0 0 18px">פתיחה ראשונה במכשיר הזה: הדביקו את הקישור המלא שקיבלתם (או את מפתח הגישה). אחרי זה המכשיר יזכור אותו.</p>' +
    '<input id="kp" dir="ltr" autocomplete="off" style="width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:10px" placeholder="https://…/#…">' +
    '<button id="kb" style="margin-top:12px;width:100%;padding:12px;font-size:16px;border:0;border-radius:10px;background:#4f46e5;color:#fff">כניסה</button>' +
    '<p id="km" style="color:#b91c1c;min-height:1.2em"></p></div>';
  function go() {
    var v = document.getElementById('kp').value.trim(), m = v.match(/[0-9a-f]{32}/i), msg = document.getElementById('km');
    if (!m) { msg.textContent = 'לא נמצא מפתח תקין. הדביקו את הקישור המלא.'; return; }
    msg.style.color = '#555'; msg.textContent = 'בודק…';
    KEY = m[0];
    call('ping').then(function () {
      try { localStorage.setItem('ds_sync_key', KEY); } catch (e) {}
      location.hash = KEY; location.reload();
    }).catch(function () { msg.style.color = '#b91c1c'; msg.textContent = 'המפתח לא התקבל. בדקו את הקישור.'; });
  }
  document.getElementById('kb').onclick = go;
  document.getElementById('kp').onkeydown = function (e) { if (e.key === 'Enter') go(); };
}
/* ---------------- Boot ---------------- */
if (['today', 'agenda', 'tasks', 'summaries'].indexOf(S.tab) < 0) S.tab = 'today';
if (!KEY) { showKeyPrompt(); return; }
renderAll();
refresh();
if (!S.me) openWho();
setInterval(function () { if (!document.hidden) refresh(); }, REFRESH_MS);
setInterval(tick, 500);
})();
</script>
</body>
